apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1
  namespace: canary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canary-app
      version: v1
  template:
    metadata:
      labels:
        app: canary-app
        version: v1
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:1.0.0
        args:
        - "-text=Hello from Application V1 - Stable Version"
        ports:
        - containerPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v2
  namespace: canary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: canary-app
      version: v2
  template:
    metadata:
      labels:
        app: canary-app
        version: v2
    spec:
      containers:
      - name: app
        image: hashicorp/http-echo:1.0.0
        args:
        - "-text=Hello from Application V2 - New Version"
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: canary-app
  namespace: canary
spec:
  selector:
    app: canary-app
  ports:
  - name: http
    port: 80
    targetPort: 5678
